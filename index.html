      body {

        color: #f7fafc; /* Light text */
        transition: background-color 0.5s ease;
      }
      .slide {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        text-align: center;
        box-sizing: border-box;
        opacity: 0;
        position: absolute;
        top: 0;
        left: 0;
        transition: opacity 0.5s ease;
      }
      .slide.active {
        opacity: 1;
        z-index: 10;
      }
      .slide-title {
        font-size: 3rem;
        font-weight: 700;
        color: #90cdf4; /* Lighter blue for titles */
        margin-bottom: 1.5rem;
      }

      .slide-content {
        font-size: 1.25rem;
        font-weight: 400;
        max-width: 1000px;
        line-height: 1.6;
        margin-bottom: 1.5rem;
        max-height: 500px;
      }

      /* Buttons */
      .nav-button {
        background-color: #4a5568;
        color: #f7fafc;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        transition: background-color 0.3s ease, transform 0.2s ease;
        cursor: pointer;
        border: none;
        outline: none;
      }

      .nav-button:hover {
        background-color: #718096;
        transform: scale(1.05);
      }

      .nav-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: scale(1);
      }

      /* Vertical Progress Bar */
      .progress-bar {
        background-color: #4a5568;
        width: 8px;
        height: 150px;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .progress-fill {
        background-color: #4299e1;
        width: 100%;
        height: 0%;
        border-radius: 9999px;
        transition: height 0.5s ease;
        position: absolute;
        bottom: 0;
      }

      pre {
        background-color: #2d3748;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto; /* Horizontal scroll */
        overflow-y: auto; /* Vertical scroll */
        max-width: 100%;
        max-height: 300px; /* Adjust height limit as needed */
        margin-top: 20px;
      }
      pre::-webkit-scrollbar {
        display: none;
      }

      code {
        font-family: "Courier New", Courier, monospace;
        text-align: left;
        display: block;
        white-space: pre; /* Preserve spaces/line breaks */
      }

                                    let evenNumbers = numbers.filter(num => num % 2 === 0); // [2]</code></pre>`,
        },

        {
          title: "Error Handling: Try/Catch",
          content: `The try...catch statement is used to handle errors that may occur during code execution.
                                                    <pre><code>try {
                                      // This code might throw an error
                                      let result = someNonExistentFunction();
                                    } catch (error) {
                                      // This code runs if an error occurs
                                      console.log('An error occurred: ' + error.message);
                                    }</code></pre>`,
        },

        {
          title: "Asynchronous JavaScript (Promises)",
          content: `Promises are a way to handle asynchronous operations. They represent a value that may be available now, or in the future, or never.
                                                    <pre><code>const myPromise = new Promise((resolve, reject) => {
                                      setTimeout(() => {
                                        resolve('Promise resolved!');
                                      }, 1000);
                                    });
                                    myPromise.then(message => console.log(message)); // Output: Promise resolved!</code></pre>`,
        },
        {
          title: "Modules (ESM)",
          content: `JavaScript Modules allow you to break your code into separate files for better organization and reusability. You can export and import functions or variables.
                                                    <pre><code>// In file "math.js"
                                    export function add(a, b) {
                                      return a + b;
                                    }

                                    // In file "main.js"
                                    import { add } from './math.js';
                                    console.log(add(2, 3)); // Output: 5</code></pre>`,
        },
      ];
      let currentSlideIndex = 0;
      const slidesContainer = document.getElementById("slides-container");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progressFill = document.getElementById("progress-fill");

      /**
       * Dynamically generates the slides from the slidesData array.
       */
      function createSlides() {
        slidesData.forEach((slide, index) => {
          const slideDiv = document.createElement("div");
          slideDiv.className = "slide";
          slideDiv.setAttribute("data-index", index);

          const title = document.createElement("h2");
          title.className = "slide-title";
          title.textContent = slide.title;

          const content = document.createElement("p");
          content.className = "slide-content";
          content.innerHTML = slide.content;

          slideDiv.appendChild(title);
          slideDiv.appendChild(content);
          slidesContainer.appendChild(slideDiv);
        });
      }

      /**
       * Displays the slide at the given index.
       * @param {number} index The index of the slide to show.
       */
      function showSlide(index) {
        const slides = document.querySelectorAll(".slide");
        // Hide all slides
        slides.forEach((slide) => {
          slide.classList.remove("active");
        });
        // Show the active slide
        if (slides[index]) {
          slides[index].classList.add("active");
        }
      }

      /**
       * Updates the navigation buttons' disabled state and the progress bar.
       */
      // function updateUI() {
      //   prevBtn.disabled = currentSlideIndex === 0;
      //   nextBtn.disabled = currentSlideIndex === slidesData.length - 1;

      //   const progress = ((currentSlideIndex + 1) / slidesData.length) * 100;
      //   progressFill.style.width = `${progress}%`;
      // }
      function updateUI() {
        prevBtn.disabled = currentSlideIndex === 0;
        nextBtn.disabled = currentSlideIndex === slidesData.length - 1;

        const progress = ((currentSlideIndex + 1) / slidesData.length) * 100;
        progressFill.style.height = `${progress}%`;
      }

      /**
       * Handles the "Next" button click.
       */
      function handleNext() {
        if (currentSlideIndex < slidesData.length - 1) {
          currentSlideIndex++;
          showSlide(currentSlideIndex);
          updateUI();
        }
      }

      /**
       * Handles the "Previous" button click.
       */
      function handlePrevious() {
        if (currentSlideIndex > 0) {
          currentSlideIndex--;
          showSlide(currentSlideIndex);
          updateUI();
        }
      }

      // Add event listeners for keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          handleNext();
        } else if (e.key === "ArrowLeft") {
          handlePrevious();
        }
      });

      // Add event listeners to the navigation buttons
      nextBtn.addEventListener("click", handleNext);
      prevBtn.addEventListener("click", handlePrevious);

      // Initial setup on page load
      window.onload = function () {
        createSlides();
        showSlide(currentSlideIndex);
        updateUI();
      };
    </script>
  </body>
</html>
