<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .container {
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        margin: 0;
      }
      .profile-container {
        background: #fff;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        text-align: center;
        width: 380px;
        transition: 0.3s ease;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: tomato;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 15px;
        box-shadow: 0 5px 15px rgba(255, 99, 71, 0.5);
      }

      h2 {
        margin: 10px 0;
        color: #333;
        font-size: 24px;
      }

      p {
        margin: 5px 0 20px;
        color: #666;
        font-size: 15px;
      }

      .btn {
        display: inline-block;
        margin: 10px 5px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: tomato;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #e85b5b;
      }

      /* Modal (for editing profile) */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        width: 320px;
        text-align: left;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-content h3 {
        margin-top: 0;
        color: #333;
      }

      .modal-content label {
        font-size: 14px;
        color: #555;
      }

      .modal-content input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .modal-actions {
        text-align: right;
      }

      .modal-actions button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-left: 5px;
      }

      .save-btn {
        background: tomato;
        color: #fff;
      }

      .cancel-btn {
        background: #ccc;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="shop.html">
          <img src="/images/logo_fashion_2.png" alt="" />
        </a>
      </div>

      <ul id="nav-links">
        <li><a href="shop.html">Home</a></li>
        <li>
          <a href="#">Collections</a>
          <div class="dropdown">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Accessories</a>
          </div>
        </li>
        <li><a href="#">New Arrivals</a></li>
        <li><a href="#">Sale</a></li>
        <li><a href="#">Contact</a></li>
        <li>
          <button id="loginLink" class="btn loginLink">
            <a href="login.html">Login</a>
          </button>
        </li>
        <!-- <li>
          <button class="btn logoutLink" id="logoutLink">Logout</button>
        </li> -->
        <li id="userMenu" class="user-menu">
          <button id="avatarBtn" class="avatar-btn">
            <!-- <img
              src="https://ui-avatars.com/api/?name=R&background=ff6b6b&color=fff"
              alt="avatar"
              class="avatar"
            /> -->
            <span id="avatarLetter">U</span>
          </button>
          <ul id="dropdownMenu" class="dropdown">
            <li><a href="profile.html">Profile</a></li>
            <li>
              <button id="logoutBtn" class="btn logoutLink">Logout</button>
            </li>
          </ul>
        </li>
      </ul>

      <div class="search-container">
        <input type="text" placeholder="Search fashion..." />
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </nav>
    <div class="container">
      <div class="profile-container">
        <div class="avatar" id="profileAvatar">U</div>
        <h2 id="profileName">Guest</h2>
        <p id="profileEmail">guest@example.com</p>
        <button class="btn" id="editBtn">Edit Profile</button>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>

      <!-- Edit Profile Modal -->
      <div class="modal" id="editModal">
        <div class="modal-content">
          <h3>Edit Profile</h3>
          <label for="editUsername">Username</label>
          <input type="text" id="editUsername" />

          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" />

          <label for="editPassword">Password</label>
          <input type="password" id="editPassword" />

          <div class="modal-actions">
            <button class="cancel-btn" id="cancelEdit">Cancel</button>
            <button class="save-btn" id="saveEdit">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script>
      const profileName = document.getElementById("profileName");
      const profileEmail = document.getElementById("profileEmail");
      const profileAvatar = document.getElementById("profileAvatar");
      //   const logoutBtn = document.getElementById("logoutBtn");
      const editBtn = document.getElementById("editBtn");

      const editModal = document.getElementById("editModal");
      const editUsername = document.getElementById("editUsername");
      const editEmail = document.getElementById("editEmail");
      const editPassword = document.getElementById("editPassword");
      const saveEdit = document.getElementById("saveEdit");
      const cancelEdit = document.getElementById("cancelEdit");

      // Load user profile
      function loadProfile() {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user) {
          profileName.textContent = user.username || "User";
          profileEmail.textContent = user.email || "No email";
          profileAvatar.textContent = user.username
            ? user.username.charAt(0).toUpperCase()
            : "U";
        } else {
          alert("You must login first!");
          window.location.href = "login.html";
        }
      }

      // Logout
      //   logoutBtn.addEventListener("click", () => {
      //     localStorage.removeItem("user");
      //     alert("Logged out!");
      //     window.location.href = "login.html";
      //   });

      // Open edit modal
      editBtn.addEventListener("click", () => {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user) {
          editUsername.value = user.username || "";
          editEmail.value = user.email || "";
          editPassword.value = user.password || "";
        }
        editModal.style.display = "flex";
      });

      // Save profile changes
      saveEdit.addEventListener("click", () => {
        const updatedUser = {
          username: editUsername.value,
          email: editEmail.value,
          password: editPassword.value,
        };
        localStorage.setItem("user", JSON.stringify(updatedUser));
        alert("Profile updated!");
        editModal.style.display = "none";
        loadProfile();
      });

      // Cancel edit
      cancelEdit.addEventListener("click", () => {
        editModal.style.display = "none";
      });

      // Close modal when clicking outside
      window.addEventListener("click", (e) => {
        if (e.target === editModal) {
          editModal.style.display = "none";
        }
      });

      loadProfile();
    </script>
  </body>
</html>
